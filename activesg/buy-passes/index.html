<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy swim or gym passes</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script defer src="../../track.js"></script>
  </head>
  <body class="lifesg-body" data-activesg-root="../">
    <main class="lifesg-shell lifesg-shell--browser" aria-label="ActiveSG buy passes">
      <section class="activesg-page activesg-page--passes">
        <div class="lifesg-statusbar" aria-hidden="true">
          <span class="lifesg-time">9:50</span>
          <div class="lifesg-status-icons">
            <span class="lifesg-signal">
              <i></i><i></i><i></i><i></i>
            </span>
            <strong>WiFi</strong>
            <span class="lifesg-battery"><b>85</b></span>
          </div>
        </div>

        <div class="activesg-passes-government">
          <span class="onepa-government__crest" aria-hidden="true"></span>
          <span>A Singapore Government Agency Website</span>
          <a href="../index.html">How to identify</a>
          <span class="activesg-government__chevron" aria-hidden="true"></span>
        </div>

        <a class="activesg-language-pill" href="./index.html" aria-label="Language switcher">
          <span aria-hidden="true">🌐</span>
          <strong>EN</strong>
        </a>

        <section class="activesg-passes-alert">
          <div class="activesg-passes-alert__icon" aria-hidden="true">!</div>
          <p>
            Free all-day pool and gym admission on Sat, 8 Aug 2026 at Hougang, Jurong East, Woodlands,
            Queenstown and Heartbeat @ Bedok Sport Centres.
          </p>
        </section>

        <section class="activesg-passes-hero">
          <div class="activesg-passes-hero__top">
            <a class="activesg-back-mini" href="../index.html" aria-label="返回首页">
              <span></span>
            </a>
            <a class="activesg-passes-hero__action" href="../index.html" aria-label="返回首页">
              <span aria-hidden="true"></span>
            </a>
          </div>

          <div class="activesg-passes-hero__content">
            <div class="activesg-passes-hero__copy">
              <h1>Buy swim or gym passes</h1>
            </div>
            <div class="activesg-passes-hero__art" aria-hidden="true">
              <span class="activesg-passes-hero__bubble"></span>
              <span class="activesg-passes-hero__person"></span>
              <span class="activesg-passes-hero__dumbbell activesg-passes-hero__dumbbell--top"></span>
              <span class="activesg-passes-hero__dumbbell activesg-passes-hero__dumbbell--bottom"></span>
            </div>
          </div>
        </section>

        <section class="activesg-passes-content">
          <button class="activesg-pass-card" type="button">
            <span class="activesg-pass-card__icon activesg-pass-card__icon--swim" aria-hidden="true"></span>
            <strong>Swim</strong>
          </button>

          <button class="activesg-pass-card" type="button">
            <span class="activesg-pass-card__icon activesg-pass-card__icon--gym" aria-hidden="true"></span>
            <strong>Gym</strong>
          </button>
        </section>

        <div class="onepa-toolbar" aria-hidden="true">
          <span class="onepa-toolbar__back"></span>
          <div class="onepa-toolbar__actions"></div>
        </div>
      </section>
    </main>
  </body>
</html>
