<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivery</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="delivery-body">
    <main class="delivery-shell" aria-label="Delivery home">
      <section class="delivery-page">
        <header class="delivery-hero">
          <div class="delivery-statusbar" aria-hidden="true">
            <span class="delivery-time">12:35</span>
            <div class="delivery-status-icons">
              <span class="delivery-signal"><i></i><i></i><i></i><i></i></span>
              <span class="delivery-wifi"></span>
              <span class="delivery-battery"><b>66</b></span>
            </div>
          </div>

          <div class="delivery-search-row">
            <button class="delivery-search" type="button" aria-label="Search places">
              <span class="delivery-search__icon"></span>
              <span>Search places</span>
            </button>
            <button class="delivery-chip delivery-chip--gold" type="button" aria-label="Rewards">G</button>
            <button class="delivery-chip delivery-chip--avatar" type="button" aria-label="Profile">
              <span></span>
            </button>
          </div>
        </header>

        <section class="delivery-services" aria-label="Service shortcuts">
          <div class="delivery-services__track">
            <article class="delivery-services__slide">
              <div class="delivery-service-grid">
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon car"></span>
                  <strong>Transport</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon mart"></span>
                  <strong>Mart</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon dine"></span>
                  <strong>Dine Out</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon pay"></span>
                  <strong>PayLater</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon finance"></span>
                  <strong>Finance</strong>
                </button>
                <a class="delivery-service" href="./food.html">
                  <span class="delivery-service__icon food"></span>
                  <strong>Food</strong>
                </a>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon express"></span>
                  <strong>Express</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon mall"></span>
                  <strong>Mall</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon chope"></span>
                  <strong>Chope</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon gift"></span>
                  <strong>Gifts</strong>
                </button>
              </div>
            </article>

            <article class="delivery-services__slide" aria-hidden="true">
              <div class="delivery-service-grid">
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon dine"></span>
                  <strong>Dine Out</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon pay"></span>
                  <strong>PayLater</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon finance"></span>
                  <strong>Finance</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon transit is-new">
                    <span class="delivery-service__badge">NEW</span>
                  </span>
                  <strong>Transit</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon bike"></span>
                  <strong>Bike Rental</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon mall"></span>
                  <strong>Mall</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon chope"></span>
                  <strong>Chope</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon gift"></span>
                  <strong>Gifts</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon invest"></span>
                  <strong>Invest</strong>
                </button>
                <button class="delivery-service" type="button">
                  <span class="delivery-service__icon more"></span>
                  <strong>More</strong>
                </button>
              </div>
            </article>
          </div>

          <div class="delivery-pager" aria-hidden="true">
            <span></span>
            <span class="is-active"></span>
          </div>
        </section>

        <section class="delivery-summary" aria-label="Finance and schedule">
          <article class="delivery-summary-card">
            <div>
              <p>Finance</p>
              <strong>S$7.30</strong>
            </div>
            <span class="delivery-summary-icon wallet"></span>
          </article>
          <article class="delivery-summary-card">
            <div>
              <p>Schedule</p>
              <strong>Ride to airport</strong>
            </div>
            <span class="delivery-summary-icon calendar"></span>
          </article>
        </section>

        <section class="delivery-learn" aria-label="Learn more">
          <div class="delivery-section-head">
            <h2>Learn More</h2>
            <span class="delivery-section-arrow"></span>
          </div>

          <article class="delivery-ad-card">
            <div class="delivery-ad-visual" aria-hidden="true">
              <div class="delivery-ad-copy">
                <span>For better,</span>
                <span>for worse,</span>
                <strong>for life.</strong>
                <em>PRUActive Life V</em>
              </div>
              <div class="delivery-ad-family">
                <span class="sofa"></span>
                <span class="person person-a"></span>
                <span class="person person-b"></span>
                <span class="person person-c"></span>
                <span class="person person-d"></span>
              </div>
            </div>
            <div class="delivery-ad-body">
              <strong>Secure critical illness coverage today</strong>
              <p>Ad · Prudential Singapore</p>
            </div>
          </article>
        </section>

        <section class="delivery-promo" aria-label="Booking prompt">
          <div class="delivery-promo-card">
            <div class="delivery-promo-copy">
              <p>Need to unwind?</p>
              <strong>Book GrabCar Plus</strong>
            </div>
            <div class="delivery-promo-art" aria-hidden="true">
              <span class="delivery-promo-burst"></span>
              <span class="delivery-promo-character"></span>
              <span class="delivery-promo-car"></span>
            </div>
          </div>
          <button class="delivery-scroll-cta" type="button">
            <span class="delivery-scroll-cta__arrow"></span>
            <span>Scroll for more</span>
          </button>
          <button class="delivery-fab" type="button" aria-label="Quick actions">
            <span></span>
          </button>
        </section>

        <nav class="delivery-bottom-nav" aria-label="Bottom navigation">
          <a class="is-active" href="./index.html">
            <span class="delivery-bottom-icon home"></span>
            <strong>Home</strong>
          </a>
          <a href="./index.html">
            <span class="delivery-bottom-icon compass"></span>
            <strong>Moments</strong>
          </a>
          <a class="delivery-bottom-nav__scan" href="./index.html" aria-label="Scan">
            <span class="delivery-bottom-icon scan"></span>
          </a>
          <a href="./index.html">
            <span class="delivery-bottom-icon receipt"></span>
            <strong>Activity</strong>
          </a>
          <a href="./index.html">
            <span class="delivery-bottom-icon chat"></span>
            <strong>Messages</strong>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
